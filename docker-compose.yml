services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT:-4300}
      API_BASE_PATH: ${API_BASE_PATH:-/journal-api}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JOURNAL_ADMIN_PASSWORD: ${JOURNAL_ADMIN_PASSWORD}
      JOURNAL_AUTH_SECRET: ${JOURNAL_AUTH_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE}
    volumes:
      - api_media:/app/storage/media
      - api_backups:/app/storage/backups
    ports:
      - "127.0.0.1:${API_PORT:-4300}:${API_PORT:-4300}"

  web-build:
    build:
      context: ./web
      args:
        VITE_JOURNAL_API_BASE_URL: ${VITE_JOURNAL_API_BASE_URL:-/journal-api}
    profiles: ["build"]
    volumes:
      - ${WEB_DEPLOY_PATH:-./data/web-dist}:/output

volumes:
  mariadb_data:
  api_media:
  api_backups:
